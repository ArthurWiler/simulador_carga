<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Content-Security-Policy: mesma política do index.html, menos o
         'unsafe-eval' — aqui não há Turf, e a homepage não faz requisição
         externa nenhuma (o que ela abre, quem abre é o processo main).
         'unsafe-inline' em script-src é para o boot de tema abaixo. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               connect-src 'self';
               font-src 'self' data:;
               object-src 'none';
               base-uri 'none'"
    />
    <title>Simulador de Carga - CEMIG</title>

    <!-- Estilo único do app — a homepage reaproveita os tokens --cmg-*,
         o header e a linguagem de card. Ver a seção "Homepage" no fim. -->
    <link rel="stylesheet" href="estilo.css" />
    <!-- Boot do tema ANTES do primeiro paint (evita flash): aplica a
         escolha salva em localStorage; sem escolha, vale o tema do SO.
         Idêntico ao do index.html — as duas páginas dividem a mesma
         chave e a mesma origem (app://local), então o tema é um só. -->
    <script>
      (function () {
        try {
          const t = localStorage.getItem("tema");
          if (t === "dark" || t === "light")
            document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div class="header">
      Simulador de Carga
      <div class="header-right">
        <!-- Alterna claro/escuro (core.js); ícone reflete o tema ATIVO -->
        <button id="btnTheme" class="theme-toggle" title="Alternar tema">
          🌙
        </button>
        <img src="logo.png" alt="Logo" />
      </div>
    </div>

    <main class="home">
      <header class="home-intro">
        <h1>Ferramentas</h1>
        <p class="lead">
          Cada ferramenta abre em uma janela própria — dá para deixar o
          simulador e a análise ambiental lado a lado.
        </p>
      </header>

      <!-- Erros de abertura e aviso de atualização (home.js) -->
      <div id="homeAviso" aria-live="polite"></div>

      <!-- Cards renderizados a partir do catálogo ITENS (home.js) -->
      <div id="homeConteudo"></div>
    </main>

    <footer class="home-rodape">
      <span id="homeVersao"></span>
    </footer>

    <!-- core.js traz o tema e alertHTML(); home.js traz o catálogo. Não
         há Chart.js/Leaflet/Turf aqui: nada nesta página os usa. -->
    <script src="core.js"></script>
    <script src="home.js"></script>
  </body>
</html>
