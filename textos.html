<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Mesma política do home.html: nada externo, 'unsafe-inline' só
         para o boot de tema. A cópia usa a Clipboard API, que não passa
         por CSP. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               connect-src 'self';
               font-src 'self' data:;
               object-src 'none';
               base-uri 'none'"
    />
    <title>Textos Padrão - CEMIG</title>

    <link rel="stylesheet" href="estilo.css" />
    <script>
      (function () {
        try {
          const t = localStorage.getItem("tema");
          if (t === "dark" || t === "light")
            document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div class="header">
      Textos Padrão
      <div class="header-right">
        <button id="btnTheme" class="theme-toggle" title="Alternar tema">
          🌙
        </button>
        <img src="logo.png" alt="Logo" />
      </div>
    </div>

    <main class="textos">
      <header class="home-intro">
        <h1>Indeferimento e pendência</h1>
        <p class="lead">
          Clique no título para ver o texto ou use <strong>Copiar</strong> para
          mandá-lo direto para a área de transferência.
        </p>
      </header>

      <!-- Aviso fixo: os textos trazem dados de exemplo. -->
      <div id="txAviso"></div>

      <!-- A busca acompanha a rolagem: a lista é longa e o campo é o
           caminho normal para chegar no texto certo. -->
      <div class="tx-busca">
        <input
          id="txBusca"
          type="search"
          autocomplete="off"
          placeholder="Buscar por título ou conteúdo…"
          aria-label="Buscar texto padrão"
        />
        <span id="txContagem" class="tx-contagem" aria-live="polite"></span>
      </div>

      <div id="txLista"></div>
    </main>

    <script src="core.js"></script>
    <script src="textos-dados.js"></script>
    <script src="textos.js"></script>
  </body>
</html>
